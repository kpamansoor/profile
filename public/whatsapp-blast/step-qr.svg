<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <defs>
    <pattern id="qrm" x="36" y="30" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0f1714"/>
      <rect x="8" y="8" width="8" height="8" fill="#0f1714"/>
    </pattern>
  </defs>
  <rect width="300" height="180" rx="18" fill="#0f1714" stroke="#1f3a2f"/>

  <!-- QR code -->
  <rect x="36" y="30" width="96" height="96" rx="6" fill="#ecfdf5"/>
  <rect x="36" y="30" width="96" height="96" rx="6" fill="url(#qrm)"/>
  <g>
    <rect x="36" y="30" width="24" height="24" fill="#0f1714"/>
    <rect x="40" y="34" width="16" height="16" fill="#ecfdf5"/>
    <rect x="44" y="38" width="8" height="8" fill="#0f1714"/>
  </g>
  <g>
    <rect x="108" y="30" width="24" height="24" fill="#0f1714"/>
    <rect x="112" y="34" width="16" height="16" fill="#ecfdf5"/>
    <rect x="116" y="38" width="8" height="8" fill="#0f1714"/>
  </g>
  <g>
    <rect x="36" y="102" width="24" height="24" fill="#0f1714"/>
    <rect x="40" y="106" width="16" height="16" fill="#ecfdf5"/>
