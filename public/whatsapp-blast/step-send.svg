<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180">
  <rect width="300" height="180" rx="18" fill="#0f1714" stroke="#1f3a2f"/>

  <!-- Campaign progress -->
  <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e5f7ef">Campaign: Weekend offer</text>
  <rect x="24" y="44" width="252" height="10" rx="5" fill="#1f2a26"/>
  <rect x="24" y="44" width="0" height="10" rx="5" fill="#34d399">
    <animate attributeName="width" values="0;180;180;0" keyTimes="0;0.7;0.9;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Live stats -->
  <rect x="24" y="66" width="80" height="54" rx="12" fill="#14231d" stroke="#1f3a2f"/>
  <text x="40" y="95" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#34d399">124</text>
  <text x="40" y="111" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8aa398">Sent</text>

  <rect x="110" y="66" width="80" height="54" rx="12" fill="#14231d" stroke="#1f3a2f"/>
  <text x="126" y="95" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f87171">3</text>
  <text x="126" y="111" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8aa398">Failed</text>

  <rect x="196" y="66" width="80" height="54" rx="12" fill="#14231d" stroke="#1f3a2f"/>
  <text x="212" y="95" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#e5f7ef">73</text>
  <text x="212" y="111" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#8aa398">Left</text>

  <!-- Start button -->
  <rect x="24" y="136" width="252" height="26" rx="13" fill="#34d399"/>
  <text x="150" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#04251a">Start campaign</text>
</svg>
